<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rally 2D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Saira+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
        O tema é o mundo impresso do rali: o carnê de tempos que o controle carimba, o
        road book do navegador, a placa do organizador. Daí vêm as três famílias — uma
        condensada em caixa alta para o que é placa, uma monoespaçada para o que é número
        cronometrado, e uma de texto para o que é frase.
      */
      :root {
        --tinta: #0b0d10;
        --carta: #14181d;
        --carta-alta: #1b2027;
        --linha: rgba(238, 242, 246, 0.14);
        --papel: #eef2f6;
        --apagado: rgba(238, 242, 246, 0.52);
        --ambar: #e8b04b;
        --verde: #6fe38a;
        --vermelho: #ff5f56;

        --placa: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
        --texto: Barlow, system-ui, sans-serif;
        --numero: "Share Tech Mono", ui-monospace, "Courier New", monospace;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--tinta);
        font-family: var(--texto);
      }
      canvas {
        display: block;
        cursor: crosshair;
      }

      /* Grid, menu de modo e conclusão. O canvas continua desenhando atrás. */
      #ui {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(6, 8, 11, 0.86);
        color: var(--papel);
        overflow-y: auto;
        cursor: default;
      }
      #ui[hidden] {
        display: none;
      }

      /* A folha: o carnê que o controle preenche antes da largada. */
      .panel {
        width: min(760px, 94vw);
        margin: 24px 0;
        background: var(--carta);
        border: 1px solid var(--linha);
        border-radius: 3px;
        text-align: left;
        overflow: hidden;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
      }
      /* A tarja quadriculada do topo, que é o que faz a folha ser de corrida. */
      .panel::before {
        content: "";
        display: block;
        height: 16px;
        /* Duas fileiras de oito pixels: com uma só, a bandeira vira tracejado. */
        background-image: linear-gradient(45deg, var(--papel) 25%, transparent 25%),
          linear-gradient(-45deg, var(--papel) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, var(--papel) 75%),
          linear-gradient(-45deg, transparent 75%, var(--papel) 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-color: var(--tinta);
      }
      .panel > * {
        margin-left: 28px;
        margin-right: 28px;
      }
      .panel > .cabecalho,
      .panel > .rodape {
        margin: 0;
      }

      .cabecalho {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 28px;
        border-bottom: 1px solid var(--linha);
        background: var(--carta-alta);
      }

      h1 {
        margin: 22px 0 4px;
        font-family: var(--placa);
        font-weight: 700;
        font-size: 46px;
        line-height: 0.95;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      h1.finish {
        font-family: var(--numero);
        font-size: 68px;
        letter-spacing: -0.02em;
        color: var(--ambar);
      }
      .eyebrow {
        margin: 0;
        font-family: var(--placa);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--apagado);
      }
      .lede {
        margin: 0 0 22px;
        color: var(--apagado);
        font-size: 15px;
        min-height: 20px;
      }
      .lede b {
        color: var(--papel);
        font-family: var(--numero);
      }
      .record {
        color: var(--ambar);
        font-family: var(--placa);
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      /* Menu de abertura: duas placas de escolha. */
      .modes {
        display: grid;
        gap: 10px;
        margin-bottom: 26px;
      }
      .modes button {
        display: grid;
        gap: 3px;
        padding: 16px 18px;
        text-align: left;
        border: 1px solid var(--linha);
        border-left: 3px solid var(--apagado);
        border-radius: 2px;
        background: var(--carta-alta);
        color: inherit;
        font-family: var(--texto);
        cursor: pointer;
      }
      .modes button:hover {
        border-left-color: var(--ambar);
      }
      .modes strong {
        font-family: var(--placa);
        font-weight: 600;
        font-size: 19px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .modes span {
        font-size: 14px;
        color: var(--apagado);
      }

      /* As provas especiais e as voltas de cada uma. */
      .stages {
        display: grid;
        gap: 4px;
        margin-bottom: 22px;
      }
      .stage {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 12px;
        border: 1px solid var(--linha);
        border-radius: 2px;
        background: var(--carta-alta);
        font-family: var(--placa);
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .laps {
        display: flex;
        gap: 4px;
      }
      .lap {
        display: grid;
        place-items: center;
        width: 30px;
        height: 26px;
        border: 1px solid var(--linha);
        border-radius: 2px;
        font-family: var(--numero);
        font-size: 14px;
        cursor: pointer;
        color: var(--apagado);
      }
      .lap:hover {
        border-color: var(--papel);
        color: var(--papel);
      }
      .lap.chosen {
        border-color: var(--ambar);
        background: var(--ambar);
        color: var(--tinta);
      }

      /* Ficha de cada carro, com o número na porta. */
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .card {
        padding: 0 0 12px;
        border: 1px solid var(--linha);
        border-radius: 2px;
        background: var(--carta-alta);
        cursor: pointer;
      }
      .card:hover {
        border-color: rgba(238, 242, 246, 0.4);
      }
      .card.chosen {
        border-color: var(--ambar);
      }
      .card h2 {
        display: grid;
        place-items: center;
        margin: 0 0 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--linha);
        font-family: var(--placa);
        font-weight: 700;
        font-size: 30px;
        line-height: 1;
        color: var(--apagado);
      }
      .card.chosen h2 {
        background: var(--ambar);
        color: var(--tinta);
      }
      .card dl {
        margin: 0 12px 10px;
        font-size: 13px;
      }
      .card dl div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 0;
        border-bottom: 1px dotted rgba(238, 242, 246, 0.12);
      }
      .card dt {
        font-family: var(--placa);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--apagado);
      }
      .card dd {
        margin: 0;
        font-family: var(--numero);
        white-space: nowrap;
      }
      .card p {
        margin: 0 12px;
        font-size: 12px;
        line-height: 1.45;
        color: var(--apagado);
      }

      /* Folha de resultados. */
      .board-title {
        margin-top: 24px;
      }
      .board {
        margin: 8px 0 22px;
        font-size: 14px;
      }
      /* Offline não tem folha de resultados: sem isto sobra um buraco antes da largada. */
      .board:empty {
        margin: 0 0 20px;
      }
      .board table {
        width: 100%;
        border-collapse: collapse;
      }
      .board td {
        padding: 6px 10px;
        border-bottom: 1px solid rgba(238, 242, 246, 0.08);
        font-family: var(--numero);
      }
      .board td:nth-child(2) {
        font-family: var(--texto);
        width: 100%;
      }
      .board td:first-child {
        width: 44px;
        color: var(--apagado);
      }
      .board td:last-child {
        text-align: right;
      }
      .board tr.mine {
        color: var(--ambar);
      }
      .board .total,
      .board .empty,
      .board .warn {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--apagado);
      }
      .board .warn {
        color: var(--vermelho);
      }

      .naming {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .naming input {
        flex: 1;
        padding: 11px 12px;
        border: 1px solid rgba(238, 242, 246, 0.3);
        border-radius: 2px;
        background: var(--tinta);
        color: inherit;
        font-family: var(--texto);
      }
      .naming button {
        padding: 11px 18px;
        border: 0;
        border-radius: 2px;
        background: var(--ambar);
        color: var(--tinta);
        font-family: var(--placa);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }

      /* A largada: a placa que o organizador levanta. */
      .go {
        display: block;
        width: calc(100% - 56px);
        margin: 0 28px 4px;
        padding: 15px;
        border: 0;
        border-radius: 2px;
        background: var(--verde);
        color: var(--tinta);
        font-family: var(--placa);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .go:hover {
        filter: brightness(1.12);
      }
      .go:focus-visible,
      .card:focus-visible,
      .lap:focus-visible {
        outline: 2px solid var(--ambar);
        outline-offset: 2px;
      }

      .rodape {
        margin: 0;
        padding: 14px 28px 18px;
        font-size: 13px;
        color: var(--apagado);
      }
      .foot {
        margin: 0;
      }
      .link {
        cursor: pointer;
        border-bottom: 1px solid var(--apagado);
      }
      .link:hover {
        color: var(--papel);
        border-bottom-color: var(--papel);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
